  <meta charset="utf-8">

  <title>성민복지관 평생과정설계</title>

  <style>
/* 성민복지관 평생과정설계 — 프리미엄 화이트 · 네이비 · 골드 (라이트 모드 전용) */
:root {
  color-scheme: light;
  --navy-900: #0f1d38;
  --navy-800: #1b2f55;
  --navy-700: #24406f;
  --navy-600: #2f5290;
  --navy-100: #e8edf6;
  --navy-50: #f3f6fb;
  --gold-600: #9a7425;
  --gold-500: #c9a24a;
  --gold-100: #f6eedb;
  --gold-50: #fbf7ed;
  --bg: #f7f8fb;
  --surface: #ffffff;
  --line: #dfe3ec;
  --line-strong: #b9c1d1;
  --text: #17213a;
  --text-2: #4a5470;
  --text-3: #6b7490;
  --ok: #1f7a4d;
  --ok-bg: #e7f5ee;
  --warn: #8a5a00;
  --warn-bg: #fdf3dc;
  --danger: #b4232a;
  --danger-bg: #fdecec;
  /* 차트 범주색 (고정 순서, validate_palette 라이트 모드 검증) */
  --series-1: #2a5aa8;
  --series-2: #d08a1c;
  --series-3: #1baf7a;
  --series-4: #6250d6;
  --series-5: #e87ba4;
  --series-6: #008300;
  --series-7: #e34948;
  --radius: 12px;
  --shadow: 0 1px 2px rgba(15, 29, 56, .05), 0 4px 16px rgba(15, 29, 56, .06);
  --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", "Noto Sans KR", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: 100%; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 1rem; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; }
a { color: var(--navy-600); }
h1, h2, h3, h4 { line-height: 1.35; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold-500); outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 8px; top: -60px; background: var(--navy-800); color: #fff; padding: 10px 16px; border-radius: 8px; z-index: 100; }
.skip:focus { top: 8px; }
.muted { color: var(--text-3); }
.nowrap { white-space: nowrap; }
.pre { white-space: pre-wrap; margin: .25rem 0; }
kbd { font-size: .7em; border: 1px solid rgba(255, 255, 255, .45); border-radius: 4px; padding: 0 4px; margin-left: 4px; opacity: .85; }

/* ---------- 레이아웃 ---------- */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.sidebar { background: linear-gradient(180deg, var(--navy-900), var(--navy-800)); color: #dfe6f5; padding: 24px 16px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 24px; }
.brand { display: flex; gap: 12px; align-items: center; padding: 0 8px 20px; border-bottom: 1px solid rgba(201, 162, 74, .35); }
.brand-mark { width: 40px; height: 40px; border-radius: 10px; background: var(--gold-500); color: var(--navy-900); display: grid; place-items: center; font-weight: 800; font-size: 1.25rem; }
.brand-org { margin: 0; font-size: .8rem; color: var(--gold-500); letter-spacing: .08em; font-weight: 700; }
.brand-app { margin: 0; font-weight: 700; color: #fff; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a { display: flex; gap: 12px; align-items: center; color: #dfe6f5; text-decoration: none; padding: 10px 12px; border-radius: 10px; font-weight: 500; }
.nav a:hover { background: rgba(255, 255, 255, .08); }
.nav a[aria-current="page"] { background: rgba(201, 162, 74, .16); color: #fff; box-shadow: inset 3px 0 0 var(--gold-500); }
.nav-ic { width: 1.25rem; text-align: center; color: var(--gold-500); }
.side-foot { margin-top: auto; font-size: .78rem; color: #a9b5cf; padding: 0 8px; }
.content { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 18px 32px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.page-title { font-size: 1.35rem; font-weight: 800; color: var(--navy-900); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.font-ctrl { display: flex; gap: 6px; }
.menu-btn { display: none; }
.sample-banner { margin: 0; background: var(--gold-50); color: var(--warn); border-bottom: 1px solid var(--gold-100); padding: 8px 32px; font-size: .9rem; }
main { padding: 28px 32px 64px; max-width: 1440px; width: 100%; outline: none; }

/* ---------- 버튼 · 입력 ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 8px 16px; border-radius: 10px; border: 1px solid transparent; font-weight: 600; text-decoration: none; cursor: pointer; white-space: nowrap; background: none; }
.btn-primary { background: var(--navy-800); color: #fff; }
.btn-primary:hover { background: var(--navy-700); }
.btn-ghost { background: var(--surface); border-color: var(--line-strong); color: var(--navy-800); }
.btn-ghost:hover { border-color: var(--navy-600); background: var(--navy-50); }
.btn-ghost[aria-pressed="true"] { background: var(--navy-800); color: #fff; border-color: var(--navy-800); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-sm { min-height: 34px; padding: 4px 12px; font-size: .9rem; }
.danger-text { color: var(--danger) !important; }
.icon-btn { min-width: 40px; min-height: 40px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 10px; cursor: pointer; font-weight: 700; color: var(--navy-800); }
.icon-btn:hover { background: var(--navy-50); }
.icon-btn sup { font-size: .7em; }
.link-btn { background: none; border: 0; color: var(--text-3); text-decoration: underline; cursor: pointer; font-size: .8rem; padding: 2px 4px; }
input[type=text], input[type=search], input[type=date], input[type=number], input[type=tel], select, textarea {
  width: 100%; min-height: 40px; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 8px; background: #fff;
}
textarea { resize: vertical; min-height: 64px; }
input:hover, select:hover, textarea:hover { border-color: var(--navy-600); }
[aria-invalid="true"] { border-color: var(--danger) !important; background: var(--danger-bg) !important; }
input[type=checkbox], input[type=radio] { width: 18px; height: 18px; accent-color: var(--navy-700); margin: 0; flex: none; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field > label { font-weight: 600; display: flex; flex-direction: column; gap: 6px; }
.req { color: var(--danger); }
.help { color: var(--text-3); font-size: .875rem; margin: 0; }
.err { color: var(--danger); font-size: .9rem; margin: 4px 0 0; font-weight: 600; }
.inline-label { font-weight: 600; color: var(--text-2); font-size: .9rem; }

/* ---------- 카드 · 패널 ---------- */
.card, .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 24px; margin-bottom: 20px; }
.card h3 { font-size: 1.1rem; color: var(--navy-900); margin-bottom: 12px; }
.panel-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.panel-head h2 { font-size: 1.15rem; color: var(--navy-900); padding-left: 12px; border-left: 4px solid var(--gold-500); }
.panel-desc { margin: 0; color: var(--text-3); font-size: .85rem; }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
.toolbar-left, .toolbar-right, .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.toolbar select, .filters select { width: auto; }
.search-bar input[type=search] { width: 320px; max-width: 100%; }
.search-bar select { width: auto; }
.two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.two-col > * { margin-bottom: 0; }
.two-col + * { margin-top: 20px; }
.note-box, .warn-box { background: var(--navy-50); border: 1px solid var(--navy-100); border-left: 4px solid var(--navy-600); padding: 12px 16px; border-radius: 8px; margin: 0 0 16px; font-size: .95rem; }
.warn-box { background: var(--warn-bg); border-color: #f1dfb0; border-left-color: var(--gold-600); color: #5a4100; }
.empty { text-align: center; padding: 40px 16px; color: var(--text-2); }
.empty-title { font-weight: 700; color: var(--navy-900); font-size: 1.05rem; margin-bottom: 4px; }
.empty-mini { color: var(--text-3); padding: 24px 0; text-align: center; }
.result-count { color: var(--text-2); margin: -8px 0 12px; font-size: .9rem; }
ul.plain { padding-left: 1.2rem; margin: 0; }
ul.plain li { margin-bottom: 6px; }

/* ---------- KPI ---------- */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; margin-bottom: 20px; }
.kpis.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.kpi::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--navy-700); }
.kpi.warn::before { background: var(--gold-500); }
.kpi-label { margin: 0; color: var(--text-2); font-size: .875rem; font-weight: 600; }
.kpi-value { margin: 2px 0; font-size: 1.9rem; font-weight: 800; color: var(--navy-900); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi-sub { margin: 0; color: var(--text-3); font-size: .8rem; }

/* ---------- 차트 ---------- */
.chart-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.chart-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.chart-grid + .chart-grid { margin-top: 16px; }
.chart { margin: 0; border: 1px solid var(--line); border-radius: 10px; padding: 16px; background: #fcfcfb; min-width: 0; }
.chart-title { font-weight: 700; color: var(--navy-900); margin-bottom: 10px; font-size: .95rem; }
.chart-note { margin: -6px 0 10px; color: var(--text-3); font-size: .78rem; }
.donut-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.donut-wrap svg { width: 150px; height: 150px; overflow: visible; }
.seg { transition: stroke-width .15s; cursor: default; }
.seg.hover { stroke-width: 26; }
.donut-total { font-size: 26px; font-weight: 800; fill: var(--navy-900); }
.donut-unit { font-size: 10px; fill: var(--text-3); }
.legend { list-style: none; margin: 0; padding: 0; width: 100%; font-size: .85rem; }
.legend li { display: flex; align-items: center; gap: 8px; padding: 3px 0; border-bottom: 1px dashed var(--line); }
.legend li:last-child { border-bottom: 0; }
.sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
.lg-label { flex: 1; color: var(--text); }
.lg-val { color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.bars li { display: grid; grid-template-columns: 7.5em minmax(0, 1fr) auto; align-items: center; gap: 8px; font-size: .85rem; border-radius: 4px; }
.bars li.hover { background: var(--navy-50); }
.bar-label { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { height: 14px; background: var(--navy-50); border-radius: 4px; overflow: hidden; }
.bar-fill { display: block; height: 100%; background: var(--series-1); border-radius: 0 4px 4px 0; min-width: 2px; }
.bar-val { color: var(--text-2); font-variant-numeric: tabular-nums; min-width: 3em; text-align: right; }
.chart-table { margin-top: 10px; font-size: .85rem; }
.chart-table summary { cursor: pointer; color: var(--navy-600); font-weight: 600; }
#chart-tip { position: fixed; display: none; background: var(--navy-900); color: #fff; padding: 6px 10px; border-radius: 6px; font-size: .85rem; pointer-events: none; z-index: 200; box-shadow: var(--shadow); }

/* ---------- 표 ---------- */
.tbl-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tbl { width: 100%; border-collapse: collapse; background: var(--surface); }
.tbl th, .tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
.tbl thead th { background: var(--navy-50); color: var(--navy-800); font-size: .85rem; font-weight: 700; white-space: nowrap; }
.tbl tbody th { font-weight: 600; }
.tbl tbody tr:hover { background: #fafbfd; }
.tbl.compact th, .tbl.compact td { padding: 4px 8px; }
.tbl .num, .num { text-align: right; font-variant-numeric: tabular-nums; }
.sub { display: block; font-size: .78rem; color: var(--text-3); font-weight: 400; }
.badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700; background: var(--navy-100); color: var(--navy-800); white-space: nowrap; }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.st-on { background: var(--ok-bg); color: var(--ok); }
.st-hold { background: var(--warn-bg); color: var(--warn); }
.st-end { background: #eceef2; color: var(--text-2); }
.ph-prep { background: #e9eef8; color: #2a4a86; }
.ph-plan { background: var(--gold-100); color: #7a5a14; }
.ph-practice { background: #e3f4ec; color: #17603d; }
.ph-eval { background: #efeafc; color: #4a3aa7; }
.ph-selfhelp { background: #fde9f0; color: #9b2c5a; }
.ph-closed { background: #eceef2; color: var(--text-2); }
.pbar { display: inline-block; width: 90px; height: 8px; background: var(--navy-100); border-radius: 4px; vertical-align: middle; overflow: hidden; }
.pbar-fill { display: block; height: 100%; background: linear-gradient(90deg, var(--navy-700), var(--navy-600)); }
.pbar-num { margin-left: 8px; font-variant-numeric: tabular-nums; font-weight: 700; color: var(--navy-800); font-size: .85rem; }
.dots { display: inline-flex; gap: 6px; }
.dot-grp { display: inline-flex; gap: 2px; }
.dot { width: 10px; height: 10px; border-radius: 3px; background: var(--navy-100); border: 1px solid var(--line-strong); }
.dot.on { background: var(--gold-500); border-color: var(--gold-600); }
.alert-list, .recent-list { list-style: none; margin: 0; padding: 0; }
.alert-list li { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.al-icon { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: .8rem; flex: none; background: var(--navy-100); color: var(--navy-800); }
.al-warn .al-icon { background: var(--gold-500); color: var(--navy-900); }
.recent-list li { display: grid; grid-template-columns: 6.5em 5em minmax(0, 1fr); gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .92rem; }
.r-date { color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.r-text { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- 참여자 상세 ---------- */
.p-head { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 24px; align-items: center; border-top: 4px solid var(--gold-500); }
.p-code { margin: 0; color: var(--gold-600); font-weight: 700; font-size: .85rem; letter-spacing: .05em; }
.p-name { font-size: 1.6rem; color: var(--navy-900); }
.p-meta { margin: 4px 0 8px; color: var(--text-2); }
.p-prog { text-align: right; }
.p-actions { display: flex; flex-direction: column; gap: 8px; }
.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--line); margin-bottom: 20px; overflow-x: auto; }
.tabs [role=tab] { background: none; border: 0; padding: 12px 18px; font-weight: 600; color: var(--text-2); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; }
.tabs [role=tab][aria-selected=true] { color: var(--navy-900); border-bottom-color: var(--gold-500); }
.tabs [role=tab]:hover { color: var(--navy-700); }
.dl { display: grid; grid-template-columns: 8em minmax(0, 1fr); gap: 8px 12px; margin: 0; }
.dl dt { color: var(--text-3); font-weight: 600; }
.dl dd { margin: 0; }
.prio { margin: 0; padding-left: 1.4rem; }
.prio li { margin-bottom: 6px; }
.phases { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.phase { margin: 0; border-top: 4px solid var(--navy-600); }
.ph-border-plan { border-top-color: var(--gold-500); }
.ph-border-practice { border-top-color: var(--ok); }
.ph-border-eval { border-top-color: #6250d6; }
.ph-border-selfhelp { border-top-color: #d55181; }
.steps { list-style: none; margin: 0; padding: 0; }
.step { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 15rem); gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.step:last-child { border-bottom: 0; }
.step.done .step-check strong { color: var(--ok); }
.step-desc { margin: 2px 0 0 28px; color: var(--text-3); font-size: .85rem; }
.step-fields { display: flex; flex-direction: column; gap: 6px; }
.step-fields input { min-height: 34px; padding: 4px 8px; font-size: .9rem; }
.doc-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.doc-card { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: #fcfcfd; flex-wrap: wrap; }
.doc-name { margin: 0 0 2px; font-weight: 700; color: var(--navy-900); }
.doc-card .muted { margin: 0; font-size: .875rem; }
.doc-actions { display: flex; gap: 8px; }
.new-doc { display: flex; gap: 8px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
.new-doc select { width: auto; }
.rec-list { list-style: none; margin: 0; padding: 0; }
.rec { padding: 16px 20px; margin-bottom: 12px; }
.rec-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.rec-actions { margin-left: auto; display: flex; gap: 6px; }
.rec p { margin: 4px 0; }
.form-card { max-width: 860px; }
.form-intro { margin-top: 0; color: var(--text-2); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 20px; }
.form-grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.form-grid.three label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; }
fieldset.field { border: 0; padding: 0; margin: 0 0 14px; }
fieldset.field legend { font-weight: 600; margin-bottom: 6px; padding: 0; }
input[type=time], input[type=month] { width: 100%; min-height: 40px; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 8px; background: #fff; }
.toolbar input[type=month] { width: auto; }
.next-set { background: var(--gold-50); border: 1px solid var(--gold-100) !important; border-radius: 10px; padding: 12px !important; }
.rec-sched { border-left: 4px solid var(--gold-500); }
.meet-list { list-style: none; margin: 0; padding: 0; }
.meet-list li a { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; padding: 8px 4px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--text); font-size: .9rem; }
.meet-list li a:hover { background: var(--navy-50); }
.meet-list li.over .m-date { color: var(--danger); font-weight: 700; }
.m-date { font-variant-numeric: tabular-nums; color: var(--text-2); white-space: nowrap; }
.m-who { font-weight: 700; }
.ftable.sign { margin-top: 12px; }

(function (PPP) {
  'use strict';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }

  function toast(msg, type) {
    var box = document.getElementById('toasts');
    var el = document.createElement('div');

    el.textContent = msg;
    box.appendChild(el);
    setTimeout(function () { el.classList.add('out'); }, type === 'error' ? 6000 : 3000);
    setTimeout(function () { el.remove(); }, type === 'error' ? 6500 : 3500);
  }

    return new Promise(function (resolve) {
      var prev = document.activeElement;
      var wrap = document.createElement('div');
      wrap.className = 'modal-backdrop';
      wrap.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">' +
        '<h2 id="modal-title">' + esc(opts.title) + '</h2><div class="modal-body">' + (opts.html || '<p>' + esc(opts.message).replace(/\n/g, '<br>') + '</p>') + '</div>' +

        '<button type="button" class="btn ' + (opts.danger ? 'btn-danger' : 'btn-primary') + '" data-act="ok">' + esc(opts.okText || '확인') + '</button></div></div>';

      function onKey(e) {

          var first = f[0], last = f[f.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }

    return 'M' + x0.toFixed(2) + ' ' + y0.toFixed(2) + 'A' + r + ' ' + r + ' 0 ' + (a1 - a0 > Math.PI ? 1 : 0) + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2);
  }
  function table(caption, rows, unit, total) {
    return '<details class="chart-table"><summary>표로 보기</summary><table class="tbl compact"><caption class="sr-only">' + esc(caption) + '</caption><thead><tr><th scope="col">구분</th><th scope="col">' + esc(unit) + '</th>' + (total ? '<th scope="col">비율</th>' : '') + '</tr></thead><tbody>' +
      rows.map(function (d) { return '<tr><th scope="row">' + esc(d.label) + '</th><td class="num">' + d.value + '</td>' + (total ? '<td class="num">' + Math.round(d.value / total * 100) + '%</td>' : '') + '</tr>'; }).join('') +
      '</tbody></table></details>';
  }

  /* 도넛(원형) 차트 */
  function donut(title, data, opts) {
    opts = opts || {};
    var unit = opts.unit || '명';
    var rows = fold(data);
    var total = rows.reduce(function (s, d) { return s + d.value; }, 0);
    var id = 'c' + (++seq);
    if (!total) return '<figure class="chart"><figcaption class="chart-title">' + esc(title) + '</figcaption><p class="empty-mini">표시할 데이터가 없습니다.</p></figure>';
    var cx = 80, cy = 80, r = 62, w = 22;
    var a = -Math.PI / 2;
    var gap = rows.length > 1 ? 0.035 : 0;
    var paths = rows.map(function (d, i) {
      var sweep = d.value / total * Math.PI * 2;
      var a0 = a + gap / 2, a1 = a + sweep - gap / 2;
      a += sweep;
      var dPath = rows.length === 1 ? 'M' + cx + ' ' + (cy - r) + 'A' + r + ' ' + r + ' 0 1 1 ' + (cx - 0.01) + ' ' + (cy - r) : arc(cx, cy, r, a0, a1);
      var pct = Math.round(d.value / total * 100);
      return '<path class="seg" d="' + dPath + '" stroke="' + SERIES[i] + '" stroke-width="' + w + '" fill="none" data-tip="' + esc(d.label) + ': ' + d.value + unit + ' (' + pct + '%)" tabindex="-1"><title>' + esc(d.label) + ' ' + d.value + unit + ' (' + pct + '%)</title></path>';
    }).join('');
    var legend = rows.map(function (d, i) {
      return '<li><span class="sw" style="background:' + SERIES[i] + '"></span><span class="lg-label">' + esc(d.label) + '</span><span class="lg-val">' + d.value + unit + ' · ' + Math.round(d.value / total * 100) + '%</span></li>';
    }).join('');
    return '<figure class="chart chart-donut" aria-labelledby="' + id + '">' +
      '<figcaption class="chart-title" id="' + id + '">' + esc(title) + '</figcaption>' +
      '<div class="donut-wrap"><svg viewBox="0 0 160 160" role="img" aria-label="' + esc(title + ': ' + rows.map(function (d) { return d.label + ' ' + d.value + unit; }).join(', ')) + '">' + paths +
      '<text x="80" y="76" text-anchor="middle" class="donut-total">' + total + '</text><text x="80" y="96" text-anchor="middle" class="donut-unit">' + esc(opts.totalLabel || ('전체(' + unit + ')')) + '</text></svg>' +
      '<ul class="legend">' + legend + '</ul></div>' + table(title, rows, unit, total) + '</figure>';
  }

  /* 가로 막대 (단일 계열) */
  function bars(title, data, opts) {
    opts = opts || {};
    var unit = opts.unit || '건';
    var rows = data.filter(function (d) { return opts.keepZero || d.value > 0; });
    var id = 'c' + (++seq);
    if (!rows.length) return '<figure class="chart"><figcaption class="chart-title">' + esc(title) + '</figcaption><p class="empty-mini">표시할 데이터가 없습니다.</p></figure>';
    var max = opts.max || Math.max.apply(null, rows.map(function (d) { return d.value; }));
    var items = rows.map(function (d) {
      var pct = max ? d.value / max * 100 : 0;
      return '<li data-tip="' + esc(d.label) + ': ' + d.value + unit + '"><span class="bar-label">' + esc(d.label) + '</span><span class="bar-track"><span class="bar-fill" style="width:' + pct.toFixed(1) + '%;' + (opts.color ? 'background:' + opts.color : '') + '"></span></span><span class="bar-val">' + d.value + unit + '</span></li>';
    }).join('');
    return '<figure class="chart chart-bars" aria-labelledby="' + id + '"><figcaption class="chart-title" id="' + id + '">' + esc(title) + '</figcaption>' +
      (opts.note ? '<p class="chart-note">' + esc(opts.note) + '</p>' : '') +
      '<ul class="bars" role="list">' + items + '</ul>' + table(title, rows, unit, 0) + '</figure>';
  }

  /* 차트 위 공용 툴팁 */
  function bindTooltips(root) {
    var tip = document.getElementById('chart-tip');
    if (!tip) { tip = document.createElement('div'); tip.id = 'chart-tip'; tip.setAttribute('role', 'presentation'); document.body.appendChild(tip); }
    root.querySelectorAll('[data-tip]').forEach(function (el) {
      el.addEventListener('mousemove', function (e) {
        tip.textContent = el.getAttribute('data-tip');
        tip.style.display = 'block';
        tip.style.left = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8) + 'px';
        tip.style.top = (e.clientY + 14) + 'px';
        el.classList.add('hover');
      });
      el.addEventListener('mouseleave', function () { tip.style.display = 'none'; el.classList.remove('hover'); });
    });
  }

  PPP.charts = { donut: donut, bars: bars, bindTooltips: bindTooltips };
})(window.PPP = window.PPP || {});

</script>
  <script>
/*
 * 서식 렌더러 — 같은 스키마로 '입력(edit)'과 '보기/인쇄(view)' 두 모드를 그립니다.
 * 입력값은 data 객체에 data-path(JSON 배열) 경로로 즉시 반영됩니다.
 */
(function (PPP) {
  'use strict';
  var esc = function (s) { return PPP.ui.esc(s); };
  var idSeq = 0;

  function P(path) { return esc(JSON.stringify(path)); }
  function getPath(obj, path) {
    return path.reduce(function (o, k) { return o == null ? undefined : o[k]; }, obj);
  }
  function setPath(obj, path, val) {
    var o = obj;
    for (var i = 0; i < path.length - 1; i++) {
      if (o[path[i]] == null || typeof o[path[i]] !== 'object') o[path[i]] = typeof path[i + 1] === 'number' ? [] : {};
      o = o[path[i]];
    }
    o[path[path.length - 1]] = val;
  }
  function fmtNum(v) { var n = Number(v); return v === '' || v == null || isNaN(n) ? '' : n.toLocaleString('ko-KR'); }
  function fmtDate(v) { if (!v) return ''; var p = v.split('-'); return p[0] + '년 ' + Number(p[1]) + '월 ' + Number(p[2]) + '일'; }
  function ph(text, ctx) { return String(text || '').replace(/\{Y\}/g, ctx.year || '____').replace(/\{Y1\}/g, ctx.year ? ctx.year + 1 : '____'); }

  /* ---------- 단일 입력 ---------- */
  function input(def, path, data, mode, label) {
    var v = getPath(data, path);
    var type = def.input || 'text';
    if (mode === 'view') {
      if (type === 'checks' || type === 'radio') {
        var sel = type === 'checks' ? (Array.isArray(v) ? v : []) : [v];
        return '<span class="v-opts' + (def.column ? ' col' : '') + '">' + def.options.map(function (o) { return '<span class="v-opt">' + (sel.indexOf(o) >= 0 ? '■' : '□') + ' ' + esc(o) + '</span>'; }).join('') + '</span>';
      }
      var shown = type === 'date' ? fmtDate(v) : (type === 'number' ? fmtNum(v) : (v == null ? '' : String(v)));
      return '<span class="v-text' + (type === 'textarea' ? ' multi' : '') + '">' + esc(shown) + '</span>';
    }
    var id = 'f' + (++idSeq);
    var aria = ' aria-label="' + esc(label || def.label || '') + '"';
    var dp = ' data-path="' + P(path) + '"';
    switch (type) {
      case 'textarea':
        return '<textarea id="' + id + '" rows="' + (def.rowsN || 2) + '"' + dp + aria + '>' + esc(v || '') + '</textarea>';
      case 'select':
        return '<select id="' + id + '"' + dp + aria + '><option value="">선택</option>' + def.options.map(function (o) { return '<option' + (v === o ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
      case 'radio':
      case 'checks':
        var name = 'n' + id;
        var arr = type === 'checks' ? (Array.isArray(v) ? v : []) : null;
        return '<fieldset class="opts' + (def.column ? ' col' : '') + '"><legend class="sr-only">' + esc(label || def.label || '') + '</legend>' + def.options.map(function (o, i) {
          var checked = type === 'checks' ? arr.indexOf(o) >= 0 : v === o;
          return '<label class="opt" for="' + id + '_' + i + '"><input id="' + id + '_' + i + '" type="' + (type === 'checks' ? 'checkbox' : 'radio') + '" name="' + name + '" value="' + esc(o) + '"' + (checked ? ' checked' : '') + dp + ' data-kind="' + type + '"> ' + esc(o) + '</label>';
        }).join('') + (type === 'radio' ? '<button type="button" class="link-btn clear-radio" data-clear="' + P(path) + '" aria-label="' + esc((label || def.label || '') + ' 선택 해제') + '">해제</button>' : '') + '</fieldset>';
      case 'number':
        return '<input id="' + id + '" type="number" inputmode="decimal" step="any"' + (def.min != null ? ' min="' + def.min + '"' : ' min="0"') + ' value="' + esc(v == null ? '' : v) + '"' + dp + aria + ' data-kind="number">';
      case 'date':
        return '<input id="' + id + '" type="date" max="2100-12-31" value="' + esc(v || '') + '"' + dp + aria + '>';
      case 'tel':
        return '<input id="' + id + '" type="tel" inputmode="tel" placeholder="010-0000-0000" value="' + esc(v || '') + '"' + dp + aria + ' data-kind="tel">';
      default:
        return '<input id="' + id + '" type="text" value="' + esc(v || '') + '"' + dp + aria + '>';
    }
  }
  function inline(def, data, mode, rowLabel) {
    var inner = input(def, [def.key], data, mode, def.label || rowLabel);
    return '<span class="inline-group' + (def.input === 'checks' && def.column ? ' block' : '') + '">' + (def.prefix ? '<span class="affix">' + esc(def.prefix) + '</span>' : '') + inner + (def.suffix ? '<span class="affix">' + esc(def.suffix) + '</span>' : '') + '</span>';
  }

  /* ---------- 블록 ---------- */
  function blockTitle(b) { return b.title ? '<h4 class="blk-title">' + esc(b.title) + '</h4>' : ''; }

  function fields(b, data, mode) {
    var rows = b.rows.map(function (r) {
      var content = r.inputs ? r.inputs.map(function (d) { return inline(d, data, mode, r.label); }).join('') : inline(r, data, mode, r.label);
      var hint = r.hint ? '<span class="hint">' + esc(r.hint) + '</span>' : '';
      if (r.hideLabel) return '<tr><td colspan="2" class="td-full">' + content + '</td></tr>';
      if (r.wide) return '<tr><th colspan="2" class="th-wide" scope="colgroup">' + esc(r.label) + hint + '</th></tr><tr><td colspan="2" class="td-full">' + content + '</td></tr>';
      return '<tr><th scope="row">' + esc(r.label) + hint + '</th><td>' + content + '</td></tr>';
    }).join('');
    return blockTitle(b) + '<table class="ftable' + (b.sensitive ? ' sensitive' : '') + '"><tbody>' + rows + '</tbody></table>';
  }

  function group(b, data, mode) {
    var rows = b.items.map(function (it, i) {
      return '<tr>' + (i === 0 ? '<th scope="rowgroup" rowspan="' + b.items.length + '" class="th-group">' + esc(b.label) + '</th>' : '') +
        '<th scope="row" class="th-sub">' + esc(it.label) + '</th><td>' + input({ input: 'text', key: it.key }, [it.key], data, mode, b.label + ' - ' + it.label) + '</td></tr>';
    }).join('');
    return blockTitle(b) + '<table class="ftable grouped"><tbody>' + rows + '</tbody></table>';
  }

  function grid(b, data, mode) {
    var list = getPath(data, [b.key]);
    list = Array.isArray(list) ? list : [];
    var n = b.fixedRows ? b.fixedRows.length : Math.max(b.rows || 1, list.length);
    var editAdd = mode === 'edit' && b.addable;
    var head = '<tr>' + (b.fixedRows ? '<th scope="col" class="th-rowhead">' + esc(b.rowHeader || '') + '</th>' : '') +
      b.columns.map(function (c) { return '<th scope="col"' + (c.width ? ' style="width:' + c.width + '"' : '') + '>' + esc(c.label) + '</th>'; }).join('') +
      (editAdd ? '<th scope="col" class="th-act"><span class="sr-only">행 삭제</span></th>' : '') + '</tr>';
    var body = '';
    for (var i = 0; i < n; i++) {
      var rowLabel = b.fixedRows ? b.fixedRows[i] : (i + 1) + '행';
      body += '<tr>' + (b.fixedRows ? '<th scope="row">' + esc(b.fixedRows[i]) + '</th>' : '') +
        b.columns.map(function (c) { return '<td>' + input(c, [b.key, i, c.key], data, mode, rowLabel + ' ' + c.label) + '</td>'; }).join('') +
        (editAdd ? '<td class="td-act"><button type="button" class="icon-btn" data-del-row="' + esc(b.key) + '" data-idx="' + i + '" aria-label="' + (i + 1) + '번째 행 삭제" title="행 삭제">×</button></td>' : '') + '</tr>';
    }
    return blockTitle(b) + '<div class="tbl-scroll"><table class="ftable grid"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>' +
      (editAdd ? '<button type="button" class="btn btn-ghost btn-sm add-row" data-add-row="' + esc(b.key) + '">+ 행 추가</button>' : '');
  }

  function weekly(b, data, mode) {
    var head = '<tr><th scope="col" class="th-rowhead">구분</th>' + PPP.DAYS.map(function (d) { return '<th scope="col">' + d + '</th>'; }).join('') + '</tr>';
    var body = b.rows.map(function (r, ri) {
      return '<tr><th scope="row">' + esc(r) + '</th>' + PPP.DAYS.map(function (d) { return '<td>' + input({ input: 'textarea', rowsN: 2 }, [b.key, String(ri), d], data, mode, r + ' ' + d + '요일') + '</td>'; }).join('') + '</tr>';
    }).join('');
    return blockTitle(b) + '<div class="tbl-scroll"><table class="ftable weekly"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
  }

  function matrix(b, data, mode) {
    var head = '<tr><th scope="col" rowspan="2" class="th-item">' + esc(b.itemHeader) + '</th><th scope="colgroup" colspan="' + b.scale.length + '">스스로 할 수 있나요?</th></tr><tr>' +
      b.scale.map(function (s) { return '<th scope="col" class="th-scale">' + esc(s) + '</th>'; }).join('') + '</tr>';
    var body = b.groups.map(function (g, gi) {
      return '<tr class="mgroup"><th scope="rowgroup" colspan="' + (b.scale.length + 1) + '">' + esc(g.title) + '</th></tr>' + g.items.map(function (it, ii) {
        var k = gi + '_' + ii;
        var v = getPath(data, [b.key, k]);
        var name = 'm' + (++idSeq);
        return '<tr><th scope="row" class="th-mitem">' + esc(it) + '</th>' + b.scale.map(function (s, si) {
          if (mode === 'view') return '<td class="center">' + (v === si ? '●' : '') + '</td>';
          return '<td class="center"><input type="radio" name="' + name + '" value="' + si + '"' + (v === si ? ' checked' : '') + ' data-path="' + P([b.key, k]) + '" data-kind="level" aria-label="' + esc(it + ': ' + s) + '"></td>';
        }).join('') + '</tr>';
      }).join('');
    }).join('');
    return blockTitle(b) + '<div class="tbl-scroll"><table class="ftable matrix"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
  }

  function checkgrid(b, data, mode) {
    var head = '<tr><th scope="col">항목</th>' + b.columns.map(function (c) { return '<th scope="col">' + esc(c.label) + '</th>'; }).join('') + '</tr>';
    var body = b.items.map(function (it, i) {
      var checked = !!getPath(data, [b.key, i, 'checked']);
      var first = mode === 'view' ? (checked ? '■ ' : '□ ') + esc(it) :
        '<label class="opt"><input type="checkbox" data-path="' + P([b.key, i, 'checked']) + '" data-kind="bool"' + (checked ? ' checked' : '') + '> ' + esc(it) + '</label>';
      return '<tr><th scope="row" class="th-check">' + first + '</th>' + b.columns.map(function (c) { return '<td>' + input({ input: 'text' }, [b.key, i, c.key], data, mode, it + ' ' + c.label) + '</td>'; }).join('') + '</tr>';
    }).join('');
    return blockTitle(b) + '<div class="tbl-scroll"><table class="ftable grid"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
  }

  function compare(b, data, mode) {
    var head = '<tr><th scope="col">구분</th><th scope="col">현재</th><th scope="col">미래</th><th scope="col">이유</th></tr>';
    var body = b.rows.map(function (r) {
      function side(s) {
        var opts = s === 'future' && r.futureOptions ? r.futureOptions : r.options;
        var def = r.input === 'checks' ? { input: 'checks', options: opts, column: true } : { input: 'text' };
        var html = input(def, [b.key, r.key, s], data, mode, r.label + ' (' + (s === 'now' ? '현재' : '미래') + ')');
        if (r.detail || (r.options && r.options.indexOf('기타') >= 0)) {
          html += '<span class="inline-group"><span class="affix">' + (r.detail ? '지역' : '기타') + '</span>' + input({ input: 'text' }, [b.key, r.key, s + 'Detail'], data, mode, r.label + ' ' + (s === 'now' ? '현재' : '미래') + ' 상세') + '</span>';
        }

      }
      return '<tr><th scope="row">' + esc(r.label) + '</th><td>' + side('now') + '</td><td>' + side('future') + '</td><td>' + input({ input: 'textarea' }, [b.key, r.key, 'reason'], data, mode, r.label + ' 이유') + '</td></tr>';
    }).join('');
    return blockTitle(b) + '<div class="tbl-scroll"><table class="ftable compare"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
  }

  function amountTotal(b, data, gi) {
    var groups = gi == null ? b.groups.map(function (_, i) { return i; }) : [gi];
    var sum = 0;
    groups.forEach(function (g) {
      b.groups[g].items.forEach(function (it, ii) {

  }
  function amounts(b, data, mode) {
    var hasCat = b.groups.some(function (g) { return g.items.some(function (it) { return it.cat; }); });
    var head = '<tr><th scope="col">구분</th>' + (hasCat ? '<th scope="col">세부</th>' : '') + '<th scope="col">항목</th><th scope="col">' + esc(b.valueLabel) + '</th>' + (b.ratioLabel ? '<th scope="col">' + esc(b.ratioLabel) + '</th>' : '') + '</tr>';
    var cols = (hasCat ? 4 : 3) + (b.ratioLabel ? 1 : 0);
    var body = b.groups.map(function (g, gi) {
      var span = g.items.length + (b.grandTotal ? 0 : 1);
      var rows = g.items.map(function (it, ii) {
        var k = gi + '_' + ii;
        var catCell = '';

          if (first) { var n = g.items.filter(function (x) { return x.cat === it.cat; }).length; catCell = '<th scope="rowgroup" rowspan="' + n + '" class="th-sub">' + esc(it.cat || '') + '</th>'; }
        }
        return '<tr>' + (ii === 0 ? '<th scope="rowgroup" rowspan="' + span + '" class="th-group">' + esc(g.label) + '</th>' : '') + catCell +
          '<th scope="row" class="th-mitem">' + esc(it.label) + '</th><td class="num">' + input({ input: 'number', min: 0 }, [b.key, k, 'v'], data, mode, g.label + ' ' + it.label + ' 금액') + '</td>' +
          (b.ratioLabel ? '<td>' + input({ input: 'select', options: ['1', '2', '3', '4', '5'] }, [b.key, k, 'ratio'], data, mode, it.label + ' 장애인 지출 비율') + '</td>' : '') + '</tr>';
      }).join('');
      if (!b.grandTotal) rows += '<tr class="total"><th scope="row" colspan="' + (cols - 2 - (b.ratioLabel ? 1 : 0)) + '">총 계</th><td class="num" data-total="' + esc(b.key) + '" data-g="' + gi + '">' + fmtNum(amountTotal(b, data, gi)) + '</td>' + (b.ratioLabel ? '<td></td>' : '') + '</tr>';
      return rows;
    }).join('');
    if (b.grandTotal) body += '<tr class="total"><th scope="row" colspan="' + (cols - 1 - (b.ratioLabel ? 1 : 0)) + '">총 계</th><td class="num" data-total="' + esc(b.key) + '">' + fmtNum(amountTotal(b, data)) + '</td>' + (b.ratioLabel ? '<td></td>' : '') + '</tr>';
    return blockTitle(b) + '<div class="tbl-scroll"><table class="ftable amounts"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
  }

  function photo(b, data, mode) {
    var src = data[b.key];
    var img = src ? '<img src="' + esc(src) + '" alt="참여자 사진">' : '<span class="photo-empty">' + esc(b.label) + '</span>';
    var ctrl = mode === 'edit' ? '<div class="photo-ctrl"><label class="btn btn-ghost btn-sm" for="photo-in">사진 선택</label><input type="file" id="photo-in" accept="image/*" data-photo="' + esc(b.key) + '" class="sr-only">' +
      (src ? '<button type="button" class="btn btn-ghost btn-sm" data-photo-del="' + esc(b.key) + '">사진 삭제</button>' : '') + '<span class="hint">긴 변 480px로 줄여 저장합니다. 본인·보호자 동의 후 등록하세요.</span></div>' : '';
    return '<table class="ftable photo-tbl"><tbody><tr><td class="photo-cell"><div class="photo-box">' + img + '</div>' + ctrl + '</td></tr><tr><th scope="row" class="th-wide">' + esc(b.captionLabel) + '</th></tr><tr><td>' + input({ input: 'textarea' }, [b.captionKey], data, mode, '사진 설명') + '</td></tr></tbody></table>';
  }

  var BLOCKS = { fields: fields, group: group, grid: grid, weekly: weekly, matrix: matrix, checkgrid: checkgrid, compare: compare, amounts: amounts, photo: photo,
    note: function (b) { return '<p class="form-note">' + esc(b.text) + '</p>'; } };

  /* ---------- 서식 전체 ---------- */
  function render(form, data, mode, ctx) {

  function resizeImage(file, max) {

      if (!/^image\//.test(file.type)) return reject(new Error('이미지 파일만 선택할 수 있습니다.'));
      if (file.size > 15 * 1024 * 1024) return reject(new Error('15MB 이하 이미지만 선택할 수 있습니다.'));

        if (!el.checked && i >= 0) arr.splice(i, 1);
        setPath(data, path, arr);
      } else if (kind === 'radio') {
        setPath(data, path, el.value);
      } else if (kind === 'level') {
        setPath(data, path, Number(el.value));
      } else if (kind === 'bool') {
        setPath(data, path, el.checked);

        var k = t.getAttribute('data-add-row');

        list.push({});
        data[k] = list; hooks.dirty(); hooks.rerender();

  /* 작성 정도 (빈칸이 아닌 값 수) */

  function nextTypeAfter(type) {

    var i = order.indexOf(type);

  function openMeeting(m, o) {

      title: title, okText: '저장',
      html: '<form class="modal-form" novalidate>' + meetingForm(m, Object.assign({ nextType: nextTypeAfter((m && m.type) || o.type || '') }, o)) + '</form>',
      onOpen: function (dlg) {
        var form = dlg.querySelector('form');

          var s = form.querySelector('[name=status]:checked').value, t = form.type.value, st = stepForType(t);

          form.querySelector('.prio-set').hidden = t !== '확정회의';

      onOk: function (dlg) {

        var fd = new FormData(form), v = {};

        if (!v.date || !/^\d{4}-\d{2}-\d{2}$/.test(v.date)) errs.push('일자를 입력하세요.');
        if (v.time && !/^\d{2}:\d{2}$/.test(v.time)) errs.push('시간 형식이 올바르지 않습니다.');

      }

    var list = sortMeetings(S.byParticipant('meetings', p.id));

    var html = '<div class="toolbar"><div class="toolbar-left"><p class="help">지원회의(상담·사전·통합·컨퍼런스·확정)와 세부계획 협의, 실천과정 평가 회의를 예약하고 결과를 기록합니다.' + (next && next.phase === 'plan' ? ' 다음 단계: <strong>' + esc(next.label) + '</strong>' : '') + '</p></div>' +
      '<div class="toolbar-right"><button type="button" class="btn btn-ghost" id="add-sched">+ 일정 예약</button><button type="button" class="btn btn-primary" id="add-result">+ 결과 기록</button></div></div>';
    html += list.length ? '<ul class="rec-list">' + list.map(function (m) { return meetingCard(m, false); }).join('') + '</ul>' : empty('지원회의 기록이 없습니다', '「일정 예약」으로 다음 회의를 잡거나 「결과 기록」으로 진행한 회의를 남기세요.');
    el.innerHTML = html;
    var defType = next && PPP.MEETING_TYPES.indexOf(next.label) >= 0 ? next.label : '기타';
    el.querySelector('#add-sched').addEventListener('click', function () { openMeeting(null, { pid: p.id, status: '예정', type: defType }).then(function (ok) { if (ok) render(); }); });
    el.querySelector('#add-result').addEventListener('click', function () { openMeeting(null, { pid: p.id, status: '완료', type: defType }).then(function (ok) { if (ok) render(); }); });
    bindMeetingActions(el);
  }

  /* 지원회의 전체 화면 */
  function viewMeetings(q) {
    setTitle('지원회의');
    var all = S.all('meetings').filter(function (m) { var p = S.get('participants', m.participantId); return p && !p.deletedAt; });
    var status = q.status == null ? '예정' : q.status;
    var workers = Array.from(new Set(participants().map(function (p) { return p.worker; }).filter(Boolean))).sort();
    var rows = all.filter(function (m) {
      var p = S.get('participants', m.participantId);
      return (!status || m.status === status) && (!q.type || m.type === q.type) && (!q.worker || p.worker === q.worker) && (!q.month || m.date.slice(0, 7) === q.month);
    });
    rows = sortMeetings(rows);
    var t0 = S.today();
    var cnt = function (fn) { return all.filter(fn).length; };
    var html = '<section class="kpis four" aria-label="지원회의 요약">' +
      kpi('예정된 지원회의', cnt(function (m) { return m.status === '예정'; }) + '건', '이번 주 ' + cnt(function (m) { return m.status === '예정' && m.date >= t0 && m.date <= S.addDays(t0, 7); }) + '건') +
      kpi('일정 지남 (결과 미기록)', cnt(function (m) { return m.status === '예정' && m.date < t0; }) + '건', '「결과 기록」으로 완료 처리', cnt(function (m) { return m.status === '예정' && m.date < t0; }) ? 'warn' : '') +
      kpi('이번 달 완료', cnt(function (m) { return m.status === '완료' && m.date.slice(0, 7) === t0.slice(0, 7); }) + '건', '올해 ' + cnt(function (m) { return m.status === '완료' && m.date.slice(0, 4) === t0.slice(0, 4); }) + '건') +
      kpi('다음 회의 미정', participants().filter(function (p) { return p.status === '참여중' && S.alerts(p).some(function (a) { return /일정 미정/.test(a.text); }); }).length + '명', '계획 단계 참여자 기준') + '</section>';
    html += '<form class="toolbar" id="m-filter"><div class="toolbar-left">' +
      '<label class="sr-only" for="mf-status">상태</label><select id="mf-status" name="status"><option value=""' + (status === '' ? ' selected' : '') + '>상태 전체</option>' + optionList(PPP.MEETING_STATUSES, status) + '</select>' +
      '<label class="sr-only" for="mf-type">유형</label><select id="mf-type" name="type"><option value="">유형 전체</option>' + optionList(PPP.MEETING_TYPES, q.type) + '</select>' +
      '<label class="sr-only" for="mf-worker">담당</label><select id="mf-worker" name="worker"><option value="">담당 전체</option>' + optionList(workers, q.worker) + '</select>' +
      '<label class="sr-only" for="mf-month">월</label><input type="month" id="mf-month" name="month" value="' + esc(q.month || '') + '">' +
      '</div><div class="toolbar-right"><button type="button" class="btn btn-ghost" id="m-sched">+ 일정 예약</button><button type="button" class="btn btn-primary" id="m-result">+ 결과 기록</button></div></form>';
    html += '<p class="result-count" role="status">' + rows.length + '건</p>';
    html += rows.length ? '<ul class="rec-list">' + rows.map(function (m) { return meetingCard(m, true); }).join('') + '</ul>' : empty(status === '예정' ? '예정된 지원회의가 없습니다' : '조건에 맞는 지원회의가 없습니다', '「일정 예약」으로 지원회의를 잡을 수 있습니다.');
    main.innerHTML = '<div id="meetings">' + html + '</div>';
    var root = main.querySelector('#meetings');
    root.querySelector('#m-filter').addEventListener('change', function () {
      var p = new URLSearchParams(); var f = new FormData(root.querySelector('#m-filter'));
      p.set('status', f.get('status')); ['type', 'worker', 'month'].forEach(function (k) { if (f.get(k)) p.set(k, f.get(k)); });
      location.hash = '#/meetings?' + p.toString();
    });
    root.querySelector('#m-sched').addEventListener('click', function () { openMeeting(null, { pick: true, status: '예정' }).then(function (ok) { if (ok) render(); }); });
    root.querySelector('#m-result').addEventListener('click', function () { openMeeting(null, { pick: true, status: '완료' }).then(function (ok) { if (ok) render(); }); });
    bindMeetingActions(root);
    if (q.newFor !== undefined) {
      openMeeting(null, { pick: true, pid: q.newFor, status: '예정', type: q.type || undefined }).then(function () { history.replaceState(null, '', '#/meetings'); lastHash = '#/meetings'; render(); });
    }
  }

  /* 지원회의록 (보기·인쇄) */
  function viewMeetingRecord(id) {
    var m = S.get('meetings', id);
    var p = m && S.get('participants', m.participantId);
    if (!m || m.deletedAt || !p) return notFound();
    setTitle('지원회의록 · ' + p.name + ' · ' + m.type);
    var row = function (label, val, multi) { return '<tr><th scope="row">' + esc(label) + '</th><td>' + (multi ? '<span class="v-text multi">' + esc(val || '') + '</span>' : esc(val || '')) + '</td></tr>'; };
    var roles = PPP.MEETING_ROLES.map(function (x) { return ((m.attendeeRoles || []).indexOf(x) >= 0 ? '■ ' : '□ ') + x; }).join('　');
    main.innerHTML = '<div class="toolbar no-print"><div class="toolbar-left"><a class="btn btn-ghost" href="#/p/' + p.id + '?tab=meetings">← ' + esc(p.name) + ' 회의 목록</a><a class="btn btn-ghost" href="#/meetings">지원회의 전체</a></div><div class="toolbar-right">' +
      (m.status === '예정' ? '<button type="button" class="btn btn-ghost" data-result="' + m.id + '">결과 기록</button>' : '') + '<button type="button" class="btn btn-ghost" data-edit="' + m.id + '">수정</button><button type="button" class="btn btn-primary" id="do-print">인쇄 / PDF 저장</button></div></div>' +
      '<p class="note-box no-print">앱 기본 회의록 양식입니다. 기관 고유 회의록 서식이 있으면 알려주세요 (확인 필요).</p>' +
      '<div class="paper"><article class="doc mode-view"><header class="doc-head"><p class="doc-program">평생과정설계(PPP)지원사업</p><h2 class="doc-title">지원회의록</h2><p class="doc-sub">' + esc(m.type) + (m.status !== '완료' ? ' (' + esc(m.status) + ')' : '') + '</p></header>' +
      '<table class="ftable"><tbody>' + row('참여자', p.name + ' (' + p.code + ')') + row('담당 사회복지사', p.worker) +
      row('일시', fmtDate(m.date) + (m.time ? ' ' + m.time : '')) + row('장소', m.place) +
      '<tr><th scope="row">참석 (역할)</th><td>' + esc(roles) + (m.attendees ? '<br>' + esc(m.attendees) : '') + '</td></tr>' +
      row('안건 (회의 목적)', m.agenda, true) + row('회의 내용', m.content, true) + row('결정 사항', m.decisions, true) +
      (m.type === '확정회의' ? row('확정된 영역 우선순위', (m.priorities || []).map(function (a, i) { return (i + 1) + '순위 ' + a; }).join(' / ')) : '') +
      row('다음 할 일', m.nextAction, true) + '</tbody></table>' +
      '<table class="ftable sign"><tbody><tr><th scope="row">작성자</th><td>' + esc(p.worker || '') + '</td><th scope="row">확인</th><td></td></tr></tbody></table></article></div>';
    main.querySelector('#do-print').addEventListener('click', function () { window.print(); });
    bindMeetingActions(main.querySelector('.toolbar'));
  }

  /* ---------- 활동·평가 기록 ---------- */
  function activityForm(rec) {
    var r = rec || {};
    var f = fieldWrap;
    return '<div class="form-grid">' + f('일자', '<input type="date" name="date" required max="' + S.today() + '" value="' + esc(r.date || S.today()) + '">', true) +
      f('영역', '<select name="area" required>' + optionList(PPP.AREAS, r.area, '선택') + '</select>', true) +
      f('구분', '<select name="kind">' + optionList(PPP.ACTIVITY_KINDS, r.kind || '활동기록') + '</select>', true) +
      f('평가 점수 (평가일 때)', '<select name="score">' + optionList(['1', '2', '3', '4', '5'], r.score, '없음') + '</select>') + '</div>' +
      f('활동명', '<input type="text" name="title" maxlength="100" value="' + esc(r.title || '') + '">', true) +
      f('함께한 사람 (협력)', '<input type="text" name="partners" maxlength="100" placeholder="시민옹호인, 활동지원사 등" value="' + esc(r.partners || '') + '">') +
      f('내용 · 당사자 반응', '<textarea name="content" rows="4" maxlength="3000">' + esc(r.content || '') + '</textarea>') +
      f('세부계획 조정 / 메모', '<textarea name="memo" rows="2" maxlength="1000">' + esc(r.memo || '') + '</textarea>') + '<p class="err" hidden></p>';
  }
  function openActivity(p, rec) {
    ui.modal({
      title: (rec ? '수정: ' : '새 ') + '활동·평가 기록',
      html: '<form class="modal-form" novalidate>' + activityForm(rec) + '</form>',
      okText: '저장',
      onOk: function (dlg) {
        var form = dlg.querySelector('form');
        var v = {}; new FormData(form).forEach(function (val, k) { v[k] = String(val).trim(); });
        var err = '';
        if (!v.date) err = '일자를 입력하세요.';
        else if (v.date > S.today()) err = '일자는 오늘 이후일 수 없습니다.';
        else if (!v.area) err = '영역을 선택하세요.';
        else if (!v.title) err = '활동명을 입력하세요.';
        else if (v.kind !== '활동기록' && !v.score) err = '활동평가는 점수를 선택하세요.';
        var e = form.querySelector('.err');
        if (err) { e.textContent = err; e.hidden = false; e.setAttribute('role', 'alert'); return false; }
        if (v.kind === '활동기록') v.score = '';
        S.upsert('activities', Object.assign({}, rec || {}, v, { participantId: p.id }));
        var cur = S.get('participants', p.id);
        if (v.kind !== '활동기록' && !S.stepState(cur, 'activityEval').done) S.setStep(p.id, 'activityEval', { done: true, date: v.date });
        if (!S.stepState(cur, 'practiceActivity').done) S.setStep(p.id, 'practiceActivity', { done: true, date: v.date });
        ui.toast('저장했습니다.');
        return true;
      }
    }).then(function (ok) { if (ok) render(); });
  }
  function tabActivities(p, el) {
    var list = S.byParticipant('activities', p.id).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    var html = '<div class="toolbar"><div class="toolbar-left"><p class="help">계획 기반 지역중심 활동과 월/분기/반기 활동평가를 기록합니다.</p></div><div class="toolbar-right"><button type="button" class="btn btn-primary" id="add-rec">+ 활동·평가 기록</button></div></div>';
    if (list.length) {
      var byArea = PPP.AREAS.map(function (a) { return { label: a, value: list.filter(function (x) { return x.area === a; }).length }; });
      html += '<div class="chart-grid three">' + PPP.charts.donut('영역별 활동 기록', byArea, { unit: '건' }) + '</div>';
    }
    html += list.length ? '<ul class="rec-list">' + list.map(function (r) {
      return '<li class="rec card"><div class="rec-head"><span class="r-date">' + fmtDate(r.date) + '</span><span class="badge">' + esc(r.area) + '</span><span class="badge ' + (r.kind === '활동기록' ? '' : 'st-on') + '">' + esc(r.kind) + (r.score ? ' · ' + esc(r.score) + '점' : '') + '</span><strong>' + esc(r.title || '') + '</strong>' +
        '<span class="rec-actions"><button type="button" class="btn btn-ghost btn-sm" data-edit="' + r.id + '">수정</button><button type="button" class="btn btn-ghost btn-sm danger-text" data-del="' + r.id + '">삭제</button></span></div>' +
        (r.partners ? '<p class="muted">함께: ' + esc(r.partners) + '</p>' : '') + '<p class="pre">' + esc(r.content || '') + '</p>' + (r.memo ? '<p><strong>조정/메모</strong> ' + esc(r.memo) + '</p>' : '') + '</li>';
    }).join('') + '</ul>' : empty('활동 기록이 없습니다', '오른쪽 위 버튼으로 첫 기록을 추가하세요.');
    el.innerHTML = html;
    PPP.charts.bindTooltips(el);
    el.querySelector('#add-rec').addEventListener('click', function () { openActivity(p); });
    el.addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.dataset.edit) openActivity(p, S.get('activities', b.dataset.edit));
      if (b.dataset.del) ui.confirm('기록 삭제', '이 기록을 휴지통으로 옮길까요?', { danger: true, okText: '삭제' }).then(function (ok) { if (ok) { S.softDelete('activities', b.dataset.del); ui.toast('휴지통으로 옮겼습니다.'); render(); } });
    });
  }

  /* ---------- 서식 작성 ---------- */
  function prefill(p, fid, year) {
    var d = {};
    var docs = S.byParticipant('documents', p.id);
    if (fid === 'intro') {
      d = { name: p.name, gender: p.gender, birthDate: p.birthDate, disabilityType: p.disabilityType, writtenAt: S.today(), supporter: p.worker || '' };
    } else if (fid === 'plan') {
      var prevPlan = docs.find(function (x) { return x.formId === 'plan' && x.year === year - 1; });
      var prevReview = docs.find(function (x) { return x.formId === 'review' && x.year === year - 1; });
      var intro = S.findDoc(p.id, 'intro');
      d.writtenAt = S.today(); d.writer = p.worker || '';
      d.dream = (prevPlan && prevPlan.data.dream) || (intro && intro.data.dream) || '';
      d.longGoal = (prevPlan && prevPlan.data.longGoal) || '';
      if (prevReview && Array.isArray(prevReview.data.priorities)) d.plans = prevReview.data.priorities.filter(function (r) { return r && r.area; }).map(function (r) { return { area: r.area, goal: r.content || '', action: '', note: '우선순위 반영' }; });
    } else if (fid === 'review') {
      var plan = docs.find(function (x) { return x.formId === 'plan' && x.year === year; });
      d.writtenAt = S.today(); d.writer = p.worker || '';
      if (plan) {
        d.dream = plan.data.dream || ''; d.longGoal = plan.data.longGoal || '';
        if (Array.isArray(plan.data.plans)) d.lookback = plan.data.plans.filter(function (r) { return r && (r.area || r.goal); }).map(function (r) { return { area: r.area, goal: r.goal, plan: r.action }; });
      }
    }
    return d;
  }

  function viewDoc(pid, fid, year, printMode) {
    var p = S.get('participants', pid);
    var form = PPP.FORMS[fid];
    if (!p || p.deletedAt || !form) return notFound();
    year = form.yearly ? Number(year) || new Date().getFullYear() : null;
    if (form.yearly && (year < 2000 || year > 2100)) return notFound();
    var doc = S.findDoc(pid, fid, year);
    var docName = (year ? year + '년 ' : '') + (fid === 'review' ? '행복한 미래 이야기' : form.title);
    var ctx = { name: p.name, year: year };

    if (printMode) {
      setTitle(p.name + ' · ' + docName);
      main.innerHTML = '<div class="toolbar no-print"><div class="toolbar-left"><a class="btn btn-ghost" href="#/p/' + p.id + '?tab=docs">← 서류 목록</a></div><div class="toolbar-right"><a class="btn btn-ghost" href="#/p/' + p.id + '/doc/' + fid + (year ? '/' + year : '') + '">수정</a><button type="button" class="btn btn-primary" id="do-print">인쇄 / PDF 저장</button></div></div>' +
        '<p class="note-box no-print">인쇄 대화상자에서 대상(프린터)을 <strong>「PDF로 저장」</strong>으로 선택하면 PDF 파일로 저장됩니다. 출력물에는 민감정보가 포함되어 있으니 보관·파기에 유의하세요.</p>' +
        '<div class="paper">' + PPP.formview.render(form, doc ? doc.data : {}, 'view', ctx) + '</div>';
      main.querySelector('#do-print').addEventListener('click', function () { window.print(); });
      return;
    }

    setTitle(p.name + ' · ' + docName + (doc ? '' : ' (새로 작성)'));
    var data = doc ? JSON.parse(JSON.stringify(doc.data)) : prefill(p, fid, year);
    var status = doc ? doc.status : '작성중';
    editor.dirty = !doc;
    var nav = form.sections.length > 2 ? '<nav class="sec-nav" aria-label="서식 목차"><ul>' + form.sections.map(function (s) { return '<li><a href="#sec-' + s.id + '" data-jump="sec-' + s.id + '">' + esc((s.title || '').replace(/[【】]/g, '').replace(/\{Y\}/g, year).replace(/\{Y1\}/g, year + 1).trim()) + '</a></li>'; }).join('') + '</ul></nav>' : '';
    main.innerHTML = '<div class="toolbar doc-toolbar"><div class="toolbar-left"><a class="btn btn-ghost" href="#/p/' + p.id + '?tab=docs">← 서류 목록</a><span class="save-state" id="save-state" role="status"></span></div>' +
      '<div class="toolbar-right"><label class="inline-label" for="doc-status">작성 상태</label><select id="doc-status">' + optionList(['작성중', '완료'], status) + '</select>' +
      (doc ? '<a class="btn btn-ghost" href="#/p/' + p.id + '/print/' + fid + (year ? '/' + year : '') + '">보기·인쇄</a><button type="button" class="btn btn-ghost danger-text" id="doc-del">삭제</button>' : '') +
      '<button type="button" class="btn btn-primary" id="doc-save">저장 <kbd>Ctrl+S</kbd></button></div></div>' +
      (!doc && Object.keys(data).length > 4 ? '<p class="note-box">이전 서류의 내용을 불러와 미리 채웠습니다. 확인 후 저장하세요.</p>' : '') +
      '<div class="doc-layout">' + nav + '<div class="paper" id="paper"></div></div>';
    var paper = main.querySelector('#paper');
    var stateEl = main.querySelector('#save-state');
    function paint() { paper.innerHTML = PPP.formview.render(form, data, 'edit', ctx); }
    function markDirty() { editor.dirty = true; stateEl.textContent = '저장하지 않은 변경 사항이 있습니다'; stateEl.className = 'save-state dirty'; }
    paint();
    if (editor.dirty) markDirty();
    PPP.formview.bind(paper, form, data, { dirty: markDirty, rerender: function () { var y = window.scrollY; paint(); window.scrollTo(0, y); } });
    main.querySelector('#doc-status').addEventListener('change', markDirty);
    function save() {
      var invalid = paper.querySelector('[aria-invalid="true"]');
      if (invalid) { invalid.focus(); ui.toast('형식이 맞지 않는 입력이 있습니다: ' + (invalid.getAttribute('aria-label') || ''), 'error'); return; }
      var st = main.querySelector('#doc-status').value;
      var saved = S.upsert('documents', Object.assign({}, doc || { participantId: p.id, formId: fid, year: year }, { data: JSON.parse(JSON.stringify(data)), status: st }));
      if (!saved) return;
      doc = saved;
      editor.dirty = false;
      stateEl.textContent = '저장됨 ' + new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
      stateEl.className = 'save-state ok';
      // 서류 저장에 따른 단계 자동 표시
      if (fid === 'plan' && !S.stepState(p, 'shortPlan').done && st === '완료') S.setStep(p.id, 'shortPlan', { done: true, date: S.today() });
      if (fid === 'review' && st === '완료' && !S.stepState(p, 'yearEval').done) S.setStep(p.id, 'yearEval', { done: true, date: S.today() });
      ui.toast('저장했습니다.');

          if (!ok) return;

            applyFont(S.db.settings.fontScale || 1);

    var undo = main.querySelector('#undo-restore');

        onOk: function (dlg) { if (dlg.querySelector('#wipe-confirm').value.trim() !== '삭제') { var e = dlg.querySelector('.err'); e.textContent = '「삭제」를 정확히 입력하세요.'; e.hidden = false; return false; } }
      }).then(function (ok) { if (ok) { var fs = S.db.settings.fontScale; S.reset(); S.setSetting('fontScale', fs); ui.toast('모든 데이터를 비웠습니다.'); render(); } });

  function notFound() {
    setTitle('찾을 수 없음');

  /* ---------- 라우터 ---------- */
  var lastHash = '';
  function parse() {
    var h = location.hash.replace(/^#/, '') || '/dashboard';
    var qi = h.indexOf('?');
    var path = (qi >= 0 ? h.slice(0, qi) : h).split('/').filter(Boolean).map(decodeURIComponent);
    var q = {}; if (qi >= 0) new URLSearchParams(h.slice(qi + 1)).forEach(function (v, k) { q[k] = v; });
    return { path: path, q: q };
  }
  function render() {
    var r = parse(), a = r.path;
    editor.dirty = false; editor.save = null;
    var navKey = a[0] === 'p' || a[0] === 'participants' ? 'participants' : a[0] || 'dashboard';
    document.querySelectorAll('.nav a').forEach(function (l) { if (l.dataset.nav === navKey) l.setAttribute('aria-current', 'page'); else l.removeAttribute('aria-current'); });
    document.body.classList.toggle('print-view', (a[0] === 'p' && a[2] === 'print') || (a[0] === 'forms' && !!a[1]) || (a[0] === 'meetings' && !!a[1] && a[1] !== 'new'));
    if (a[0] === 'dashboard' || !a[0]) viewDashboard(r.q);
    else if (a[0] === 'participants' && a[1] === 'new') viewParticipantForm(null);
    else if (a[0] === 'participants') viewList(r.q);
    else if (a[0] === 'p' && a[1] && !a[2]) viewDetail(a[1], r.q);
    else if (a[0] === 'p' && a[2] === 'edit') viewParticipantForm(a[1]);
    else if (a[0] === 'p' && a[2] === 'doc') viewDoc(a[1], a[3], a[4], false);
    else if (a[0] === 'p' && a[2] === 'print') viewDoc(a[1], a[3], a[4], true);
    else if (a[0] === 'meetings' && a[1] === 'new') viewMeetings(Object.assign({}, r.q, { status: '예정', newFor: r.q.pid || '' }));
    else if (a[0] === 'meetings' && a[1]) viewMeetingRecord(a[1]);
    else if (a[0] === 'meetings') viewMeetings(r.q);
    else if (a[0] === 'forms') viewForms(a[1]);
    else if (a[0] === 'trash') viewTrash();
    else if (a[0] === 'settings') viewSettings();
    else notFound();
    lastHash = location.hash;
    document.querySelector('.sidebar').classList.remove('open');
    document.getElementById('menu-btn').setAttribute('aria-expanded', 'false');
  }
  function onHash() {
    if (editor.dirty && location.hash !== lastHash) {
      var target = location.hash;
      history.replaceState(null, '', lastHash || '#/dashboard');
      ui.confirm('저장하지 않은 변경 사항', '작성 중인 내용이 저장되지 않았습니다. 저장하지 않고 이동할까요?', { okText: '저장하지 않고 이동', danger: true }).then(function (ok) {
        if (ok) { editor.dirty = false; location.hash = target; }
      });
      return;
    }
    var keepScroll = lastHash.split('?')[0] === location.hash.split('?')[0] && /^#\/p\//.test(location.hash);
    render();
    if (!keepScroll) { window.scrollTo(0, 0); main.focus({ preventScroll: true }); }
  }

  function init() {
    main = document.getElementById('main');
    titleEl = document.getElementById('page-title');
    main.innerHTML = '<p class="empty" role="status">데이터를 불러오는 중…</p>';
    S.load().then(function (data) {
      if (!data) return S.reset(PPP.sample.build());
    }).then(function () {
      S.requestPersist();
      start();
    }, function (err) {
      S.useMemory(PPP.sample.build());
      start();
      ui.modal({ title: '저장소를 사용할 수 없습니다', message: '이 브라우저에서 IndexedDB를 열 수 없어 저장 없이 임시로 실행합니다. 입력한 내용은 창을 닫으면 사라집니다.\n(시크릿 창이거나 사이트 데이터 저장이 차단된 경우일 수 있습니다)\n\n원인: ' + err.message, cancel: false, okText: '확인' });
      document.getElementById('storage-banner').hidden = false;
    });
  }
  function start() {
    applyFont(S.db.settings.fontScale || 1);
    document.getElementById('sample-banner').hidden = !S.db.meta.sample;
    S.onChange(function () { document.getElementById('sample-banner').hidden = !S.db.meta.sample; });
    document.addEventListener('click', function (e) {
      var b = e.target.closest('[data-font]');
      if (b) { var s = Number(b.getAttribute('data-font')); S.setSetting('fontScale', s); applyFont(s); }
    });
    document.getElementById('font-dec').addEventListener('click', function () { step(-1); });
    document.getElementById('font-inc').addEventListener('click', function () { step(1); });
    function step(d) {
      var i = FONT_STEPS.indexOf(S.db.settings.fontScale || 1); if (i < 0) i = 1;
      i = Math.max(0, Math.min(FONT_STEPS.length - 1, i + d));
      S.setSetting('fontScale', FONT_STEPS[i]); applyFont(FONT_STEPS[i]);
      ui.toast('글자 크기: ' + ['작게', '보통', '크게', '아주 크게'][i]);
    }
    document.getElementById('menu-btn').addEventListener('click', function () {
      var sb = document.querySelector('.sidebar'); var open = !sb.classList.contains('open');
      sb.classList.toggle('open', open); this.setAttribute('aria-expanded', String(open));
    });
    document.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && editor.save) { e.preventDefault(); editor.save(); }
    });
    window.addEventListener('beforeunload', function (e) { if (editor.dirty) { e.preventDefault(); e.returnValue = ''; } });
    window.addEventListener('hashchange', onHash);
    S.onExternalChange(function () { if (editor.dirty || document.querySelector('.modal')) return; S.reload().then(function () { render(); ui.toast('다른 창에서 변경된 데이터를 불러왔습니다.'); }); });
    render();
  }

  PPP.app = { init: init };
  document.addEventListener('DOMContentLoaded', init);
})(window.PPP = window.PPP || {});

</script>
</body>
</html>
